# Server Configuration
server.port=8083
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# Database Configuration - H2 (In-memory for development)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false
# Disable schema.sql initialization (using JPA auto-creation instead)
spring.sql.init.mode=never

# Flyway Configuration (disabled temporarily)
spring.flyway.enabled=false

# H2 Console (enabled only in development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.algo.backend=INFO
logging.level.org.hibernate.SQL=INFO

# JWT Configuration
jwt.secret=YourSuperSecretKeyShouldBeLongAndSecureAtLeast64CharactersLong1234567890abcdefghijklmnopqrstuvwxyz
# JWT token expiration (24 hours in milliseconds)
jwt.expiration=86400000
jwt.issuer=AlgorithmVisualizer
jwt.audience=AlgorithmVisualizerFrontend

# Judge0 Configuration
judge0.baseUrl=https://ce.judge0.com
judge0.apiKey=
judge0.callbackUrl=http://localhost:8080/api/judge/callback

# CORS Configuration
cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:55442
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
